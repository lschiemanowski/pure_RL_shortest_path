anchors:
  - id: 01a0149f-9d0d-71ea-939e-06fe8790985f
    selector:
      quote: For each on-policy token trajectory, a learned scalar value function estimates
        expected future verifier reward from every sampled action state. Intermediate rewards
        are zero and the terminal sampled action receives the completion's scalar verifier
        reward. Generalized advantage estimation uses configurable discount and trace-decay
        factors to produce per-token advantages and value targets without changing reward
        semantics.
    links:
      - id: 01a014a1-15c1-75e3-bb0b-d150f5ea5048
        kind: informational
  - id: 01a0149f-9d0d-7473-a7c2-b7ed04b19a6b
    selector:
      quote: The complete update may also include the existing reference-policy divergence
        penalty and valid-next-token auxiliary objective as separately configured terms. Multiple
        optimization epochs and microbatches reuse one fixed on-policy batch; old log probabilities,
        old values, advantages, and returns remain fixed throughout those epochs. Only the
        current actor and value function are updated.
    links:
      - id: 01a014a1-15c1-7adc-b136-ec4db3ebf1e6
        kind: informational
  - id: 01a0149f-9d0d-7210-808e-a0d7e3613314
    selector:
      quote: The policy objective applies PPO's clipped likelihood-ratio surrogate to sampled
        tokens. When configured, a fixed rollout batch whose scalar completion rewards are
        all zero contributes no clipped policy-surrogate term; value learning, entropy, reference-policy
        divergence, and valid-next-token auxiliary terms remain governed by their independent
        configuration. A separately weighted value objective optionally clips value changes
        around rollout-time predictions, and an entropy bonus remains explicit. Advantage
        normalization preserves a nonzero constant signal when variance is negligible instead
        of erasing it.
    links:
      - id: 01a014a1-15c1-7adc-b136-ec4db3ebf1e6
        kind: informational
