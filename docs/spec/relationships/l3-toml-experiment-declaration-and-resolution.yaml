  - path: src/pure_rl_shortest_path/run.py
    selector:
      quote: |-
        def load_run_configuration(path: str | Path) -> LoadedRunConfiguration:
            """Read one TOML declaration and retain both source and resolved identities."""

            source_path = Path(path).expanduser().resolve()
            source_bytes = source_path.read_bytes()
            try:
                declaration = tomllib.loads(source_bytes.decode("utf-8"))
            except (UnicodeDecodeError, tomllib.TOMLDecodeError) as error:
                raise ConfigurationError(f"invalid TOML configuration: {error}") from error
            resolved = resolve_run_configuration(
                declaration, declaration_directory=source_path.parent
            )
            resolved_bytes = _canonical_json_bytes(resolved_configuration_record(resolved))
            return LoadedRunConfiguration(
                source_path=source_path,
                source_bytes=source_bytes,
                resolved=resolved,
                source_sha256=hashlib.sha256(source_bytes).hexdigest(),
                resolved_sha256=hashlib.sha256(resolved_bytes).hexdigest(),
            )
anchors:
  - id: 019ff54c-87f7-74d5-9be7-8ff766f24cd3
    selector:
      quote: |-
        A fresh training run begins from one versioned TOML experiment declaration. Its
        named sections describe the task vocabulary and positive
        `minimum_reason_tokens` requirement, curriculum stages and mixture,
        transformer architecture, rollout collection, reward shaping, auxiliary
        objective, GRPO update, evaluation schedule, checkpoint schedule, runtime, and
        artifact location. The minimum-reasoning requirement defaults to one when
        omitted for compatibility. Ordered values such as curriculum stages retain
        their declared order.
    links:
      - path: src/pure_rl_shortest_path/run.py
        kind: contractual
        code_anchor: 019ff54c-87f7-716a-a961-0e04b6851ff1
        selector:
          quote: |2-
                root = _ConfigTable(declaration, "root")
                schema_version = root.take("schema_version")
                name = root.take("name")
                seed = root.take("seed")
