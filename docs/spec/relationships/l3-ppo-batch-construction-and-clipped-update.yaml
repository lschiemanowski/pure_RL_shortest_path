    selector:
      quote: A packed PPO batch contains prompts, sampled actions, action masks, rollout-time
        log probabilities and values, generalized advantages, fixed returns, and valid-next
        sets. It is collected once from the current actor-value model and is not regenerated
        during optimization epochs.
    links:
