  - id: 01a014a1-15c1-7e6c-9f42-b0739dc1320a
    selector:
      quote: For every sampled token, the policy loss is the negative minimum of the unclipped
        likelihood-ratio advantage and the ratio clipped to the declared interval. When configured
        and every scalar completion reward in the fixed rollout batch is zero, the policy
        loss is instead zero for every optimization epoch and microbatch; value loss, entropy,
        reference-policy divergence, and valid-next auxiliary loss remain independently active
        according to their coefficients. The value loss is the larger squared error between
        the return and either the new prediction or, when value clipping is enabled, the rollout
        prediction plus a clipped change. Entropy is averaged over sampled-token distributions.
        Clip fraction and explained variance remain observable.
