  - id: 01a014a1-15c1-7be7-bbb1-87d390191b42
    selector:
      quote: The total loss combines policy loss, the weighted value loss, negative weighted
        entropy, reference-policy divergence, and valid-next auxiliary loss. Declared epochs
        and microbatches reuse fixed rollout statistics, gradients are clipped before optimizer
        steps, and only the current actor and value head are updated.
