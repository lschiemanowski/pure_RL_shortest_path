anchors:
  - id: 019ff566-c44f-7647-a24c-9da41e4f5def
    selector:
      quote: Training writes schema-versioned JSON Lines records by appending complete records
        and synchronizing them to disk. Every event identifies its run, completed step, resolved-configuration
        digest, and selected algorithm. Shared records retain rollout counts, verifier reward
        components, shaping diagnostics, sampling settings, and optimizer diagnostics. GRPO
        records its policy, divergence, valid-next, and zero-variance metrics; PPO additionally
        records value loss, entropy, clip fraction, explained variance, and their coefficients.
    links:
      - path: src/pure_rl_shortest_path/run.py
        kind: contractual
