      quote: The transformer configuration declares positive vocabulary, context, model, layer,
        attention-head, and feed-forward dimensions together with positive rotary-position
        and normalization constants. Model width is divisible by the head count, and each
        attention-head dimension is even so rotary positions are well-defined. Construction
        rejects a configuration that violates these relationships.
