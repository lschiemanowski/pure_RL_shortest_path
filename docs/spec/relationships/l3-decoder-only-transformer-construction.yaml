  - path: src/pure_rl_shortest_path/model.py
    selector:
      quote: |2-
            def __init__(self, config: TransformerConfig) -> None:
                super().__init__()
                self.config = config
                self.embedding = nn.Embedding(config.vocab_size, config.d_model)
                self.blocks = nn.ModuleList(
                    TransformerBlock(config) for _ in range(config.n_layers)
                )
                self.final_norm = RMSNorm(config.d_model, config.norm_eps)
                self.lm_head = nn.Linear(config.d_model, config.vocab_size, bias=False)
                self.apply(self._initialize)
                self.lm_head.weight = self.embedding.weight

            @staticmethod
            def _initialize(module: nn.Module) -> None:
                if isinstance(module, (nn.Linear, nn.Embedding)):
                    nn.init.normal_(module.weight, mean=0.0, std=0.02)
  - path: src/pure_rl_shortest_path/model.py
    selector:
      quote: |2-
            def forward_with_hidden_states(
                self,
                input_ids: torch.Tensor,
                attention_mask: torch.Tensor | None = None,
            ) -> tuple[torch.Tensor, torch.Tensor]:
                """Score a full prefix and expose normalized states for a value head."""

                if input_ids.ndim != 2 or input_ids.shape[1] == 0:
                    raise ValueError("input_ids must have shape [batch, positive_length]")
                batch, length = input_ids.shape
                if length > self.config.max_context_length:
                    raise ValueError("effective prefix exceeds max_context_length")
                if attention_mask is not None and attention_mask.shape != (batch, length):
                    raise ValueError(
                        "attention_mask must have shape [batch, effective_prefix_length]"
                    )
                hidden = self.embedding(input_ids)
                for block in self.blocks:
                    hidden, _ = block(hidden, attention_mask=attention_mask)
                hidden = self.final_norm(hidden)
                return self.lm_head(hidden), hidden
anchors:
  - id: 019ff180-b61f-7e52-94d5-1cb458cfeb48
    selector:
      quote: The model uses token embeddings, pre-normalized causal self-attention with rotary
        positions, gated SiLU feed-forward blocks, final RMS normalization, and a tied full-vocabulary
        output. Ordinary actor scoring retains its logits-and-cache interface. A separate
        full-prefix training operation returns the identical actor logits together with the
        final normalized tensor supplied to the language-model head, allowing a value head
        without changing sampling or evaluation.
