  - id: 019ff564-feee-7b57-9bfa-803ce161d9cf
    selector:
      quote: Loading validates the checkpoint schema, presence of PPO value parameters, and
        the configuration digest against either the serialized configuration record or its
        normalized typed form. A valid older record may therefore acquire newly introduced
        defaults without being rejected or losing its original digest. Same-run resumption
        requires the recorded configuration. A derived run may change future training settings
        but rejects changes to the selected algorithm, task vocabulary, completion protocol,
        model architecture, master seed, or ordered curriculum stages.
