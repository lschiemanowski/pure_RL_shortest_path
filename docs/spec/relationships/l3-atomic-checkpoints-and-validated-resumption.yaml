      quote: Every checkpoint is a versioned record containing the selected algorithm, current
        and frozen-reference actor parameters, optimizer state, and PPO value-head parameters
        when applicable, plus the completed step, curriculum state, resolved configuration
        and digest, run identity, and named random states required to continue training. Its
        purpose distinguishes periodic, curriculum-transition, interruption, and final checkpoints.
