anchors:
  - id: 019ff06a-a006-70a5-b3fb-39c2216e768a
    selector:
      quote: Each run retains its resolved configuration and provenance, including the selected
        optimization algorithm, an append-only sequence of training and evaluation metric
        records, checkpoints, logs, and representative completions. Metric and completion
        records identify the run, training step, curriculum position, policy checkpoint, problem
        distribution, and evaluation or training protocol under which they were produced.
    links:
      - id: 019feb9e-e54d-7450-bdf0-d2831a73da31
        kind: informational
      - id: 019ff566-c44f-7e89-9f82-0d916901384c
        kind: informational
  - id: 019ff06a-a006-7c72-aee9-9e6017cf6c3e
    selector:
      quote: 'Learning signals remain auditable in the evidence: verifier reward, each shaping
        term, auxiliary-objective contribution, and their configured coefficients are recorded
        separately where applicable. PPO records its policy, value, entropy, clipping, divergence,
        explained-variance, and gradient metrics separately from GRPO metrics. Aggregate metrics
        retain their denominators, and representative completions preserve enough of the graph,
        query, generated tokens, parsed result, and verifier facts to explain how the reported
        outcome was obtained.'
    links:
      - id: 019feb9e-e54d-7450-bdf0-d2831a73da31
        kind: informational
      - id: 019ff566-c44f-7e89-9f82-0d916901384c
        kind: informational
  - id: 019ff06a-a006-7a32-80fb-242c36278a12
    selector:
      quote: Evidence records expose the task semantics, graph scale, curriculum position,
        policy architecture, training duration, optimization algorithm, sampling protocol,
        reward shaping, and auxiliary objectives needed to judge whether results are comparable.
        Analysis or reporting that combines runs identifies relevant differences rather than
        silently pooling incompatible evidence. The training environment records this information
        but does not itself decide which scientific comparisons are appropriate.
    links:
      - id: 019feb9e-e54d-7450-bdf0-d2831a73da31
        kind: informational
      - id: 019ff566-c44f-7e89-9f82-0d916901384c
        kind: informational
