      quote: |-
        def valid_next_token_sets(
            example: GraphExample,
            completion: Sequence[int],
            vocabulary: Vocabulary,
        ) -> tuple[frozenset[int], ...]:
            """Return every locally legal next-token set along a sampled completion.

            An invalid sampled action is rejected by this auxiliary state machine and
            leaves its state unchanged.  It never changes the actual completion.
            """

            results: list[frozenset[int]] = []
            active_tokens = {
                vocabulary.node_token(label) for label in example.active_labels
            }
            state = "reasoning"
            current = example.source
            after_jump = False
            walk_edges = 0
            legal_reasoning_moves = 0
            visited_answer_nodes: set[int] = set()

            for action in completion:
                if state == "reasoning":
                    if after_jump:
                        valid = set(active_tokens)
                    else:
                        valid = {
                            vocabulary.node_token(label)
                            for label in example.adjacency[current]
                        }
                        if walk_edges > 0:
                            valid.add(JUMP)
                        if legal_reasoning_moves > 0:
                            valid.add(END_REASON)
                elif state == "begin_answer":
                    valid = {BEGIN_ANSWER}
                elif state == "answer_source":
                    valid = {vocabulary.node_token(example.source)}
                elif state == "answer_walk":
                    if current == example.target:
                        valid = {END_ANSWER}
                    else:
                        valid = {
                            vocabulary.node_token(label)
                            for label in example.adjacency[current]
                            if label not in visited_answer_nodes
                        }
                elif state == "eos":
                    valid = {EOS}
                else:
                    valid = set()

                results.append(frozenset(valid))
                if action not in valid:
                    continue

                if state == "reasoning":
                    if after_jump:
                        label = vocabulary.token_node(action)
                        assert label is not None
                        current = label
                        after_jump = False
                        walk_edges = 0
                    elif action == JUMP:
                        after_jump = True
                    elif action == END_REASON:
                        state = "begin_answer"
                    else:
                        label = vocabulary.token_node(action)
                        assert label is not None
                        current = label
                        walk_edges += 1
                        legal_reasoning_moves += 1
                elif state == "begin_answer":
                    state = "answer_source"
                elif state == "answer_source":
                    current = example.source
                    visited_answer_nodes = {current}
                    state = "answer_walk"
                elif state == "answer_walk":
                    if action == END_ANSWER:
                        state = "eos"
                    else:
                        label = vocabulary.token_node(action)
                        assert label is not None
                        current = label
                        visited_answer_nodes.add(label)
                elif state == "eos":
                    state = "done"

            return tuple(results)
anchors:
  - id: 019ff1ac-85fb-719c-9298-a8312607d654
    selector:
      quote: |-
        An auxiliary graph-aware state machine computes a set \(V_t\) of locally valid
        actions before each sampled completion token. During reasoning, legal actions
        are graph neighbors of the current node, a restart marker after a nonempty walk,
        and the end-reasoning marker after at least one legal reasoning move. A restart
        must be followed by any active node label. The answer protocol then requires the
        begin-answer marker, the query source, unvisited graph neighbors forming a
        simple path, the end-answer marker upon reaching the target, and finally the
        termination symbol.
