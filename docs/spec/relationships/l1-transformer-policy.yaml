anchors:
  - id: 019feb9e-e54d-7694-9f5e-9551f8a9ca15
    selector:
      quote: The transformer policy is the trainable actor in the system. It contains no task-specific
        verifier, shortest-path oracle, demonstrated solution, or mechanism for looking up
        a correct next action.
    links:
      - id: 019feb83-80f6-786a-bf25-d637dd4a6af1
        kind: informational
  - id: 019fec29-efaa-7eb9-b12b-fa3ac1d7d4de
    selector:
      quote: Its transformer model owns the declared decoder-only causal architecture, random
        initialization, and learned parameters that identify the current actor. During PPO
        training it may expose final normalized token representations to a separate training-only
        value function; policy sampling and evaluation remain actor-only.
    links:
      - id: 019fec29-efaa-7969-8feb-594a61b8874d
        kind: informational
  - id: 019fec29-efaa-7740-acd0-800543a4bd55
    selector:
      quote: Its token-prefix scoring interface maps serialized token prefixes to next-token
        scores over the complete task vocabulary. Training and evaluation use the same scoring
        interface; the invoking process owns sampling, token constraints, and termination
        behavior.
    links:
      - id: 019fec29-efaa-756e-a1a3-12c4676ea60a
        kind: informational
