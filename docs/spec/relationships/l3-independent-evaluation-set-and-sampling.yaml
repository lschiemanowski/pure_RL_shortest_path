        def fixed_evaluation_problem_set(
            fixed_set_id: str,
            problem_config: GraphProblemConfig,
            examples: Sequence[GraphExample],
        ) -> EvaluationProblemSet:
            """Attach an explicit stable identity to a supplied immutable evaluation set."""

