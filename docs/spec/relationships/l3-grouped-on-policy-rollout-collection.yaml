  - id: 019ff1ac-85fb-7c0b-97cb-4e2edd839e65
    selector:
      quote: Each retained sample identifies its problem, group position, exact completion
        tokens, and whether termination was sampled. After verification and packing, PPO snapshots
        detached action log probabilities and scalar values before its first optimization
        epoch. Batching, left padding, causal attention caching, and seeded categorical sampling
        may alter execution but not the defined distribution or sample order.
