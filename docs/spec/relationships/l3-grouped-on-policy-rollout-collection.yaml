  - id: 019ff1b1-fc75-7690-9e65-2345ea4e15cc
    selector:
      quote: For each supplied training problem, the fixed current actor generates the configured
        number of independent completions before any parameter update. GRPO retains adjacent
        completions as one comparison group; PPO treats them as independent trajectories even
        when execution keeps them adjacent.
