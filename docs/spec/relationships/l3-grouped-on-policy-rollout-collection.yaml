  - id: 019ff1ac-85fb-739a-a978-d3605f4a97e3
    selector:
      quote: At every generated position, the next token is sampled categorically from the
        complete softmax of the current actor's raw full-vocabulary logits. Training requires
        temperature one and top-p one; the configuration rejects values that would rescale
        or truncate this distribution. Sampling applies no graph-legality mask, forced delimiter,
        verifier intervention, or post-hoc token edit. A completion ends only when it samples
        the termination symbol or exhausts the declared maximum length; reaching the length
        limit does not append an artificial termination symbol.
