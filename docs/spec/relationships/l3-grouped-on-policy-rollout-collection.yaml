  - path: src/pure_rl_shortest_path/rl.py
    selector:
      quote: |
        def sample_policy_tokens(
            logits: torch.Tensor, generator: torch.Generator | None = None
        ) -> torch.Tensor:
            """Draw one categorical action per row from the complete policy softmax."""

            if logits.ndim != 2 or logits.shape[0] == 0 or logits.shape[1] == 0:
                raise ValueError("logits must have shape [positive_batch, positive_vocabulary]")
            probabilities = logits.float().softmax(dim=-1)
            return torch.multinomial(probabilities, 1, generator=generator).squeeze(1)
  - path: src/pure_rl_shortest_path/rl.py
    selector:
      quote: |
        @torch.no_grad()
        def collect_grouped_completions(
            model: Transformer,
            examples: Sequence[GraphExample],
            config: RolloutSamplingConfig,
            *,
            device: torch.device,
            generator: torch.Generator | None = None,
            autocast_dtype: torch.dtype | None = None,
        ) -> list[SampledCompletion]:
            """Samples adjacent completion groups without task-specific token constraints."""

            expanded = [
                (group_id, example)
                for group_id, example in enumerate(examples)
                for _ in range(config.group_size)
            ]
            prng = generator
            if generator is not None and device.type == "cuda":
                seed = int(torch.randint(2**63-1, (), generator=generator))
                prng = torch.Generator(device).manual_seed(seed)
            generated = generate_tokens(
                model,
                [example.prompt for _, example in expanded],
                max_new_tokens=config.max_new_tokens,
                batch_size=config.generation_batch_size,
                pad_token=PAD,
                eos_token=EOS,
                device=device,
                select_next=lambda logits: sample_policy_tokens(logits, prng),
                autocast_dtype=autocast_dtype,
            )
            return [
                SampledCompletion(
                    example=example,
                    completion=completion,
                    group_id=group_id,
                    terminated_by_eos=bool(completion and completion[-1] == EOS),
                )
                for (group_id, example), completion in zip(expanded, generated)
            ]
