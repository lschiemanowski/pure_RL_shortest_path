  - id: 01a014a1-15c1-71b8-b282-39a68c3daf10
    selector:
      quote: Advantages are normalized across real sampled actions when their finite standard
        deviation exceeds the declared numerical tolerance. Otherwise the original advantages
        are retained, so an equal nonzero terminal signal can still train the policy.
