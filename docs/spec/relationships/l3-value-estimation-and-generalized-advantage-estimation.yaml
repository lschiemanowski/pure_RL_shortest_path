  - id: 01a014a1-15c1-76b0-b913-b29c9374a3e8
    selector:
      quote: For a trajectory with terminal completion reward on its final action and zero
        intermediate rewards, temporal-difference residuals are computed as \(\delta_t=r_t+\gamma
        V_{t+1}-V_t\), with zero bootstrap after termination. Reverse accumulation \(A_t=\delta_t+\gamma\lambda
        A_{t+1}\) produces generalized advantages, and \(R_t=A_t+V_t\) produces fixed value
        targets. Padding never contributes.
