    selector:
      quote: A scalar value head reads the transformer's final normalized hidden state at
        every sampled action position and predicts expected discounted verifier return. It
        is initialized and optimized only for PPO training; policy sampling, reference scoring,
        and evaluation remain actor-only. Rollout collection stores detached value predictions
        alongside action log probabilities.
