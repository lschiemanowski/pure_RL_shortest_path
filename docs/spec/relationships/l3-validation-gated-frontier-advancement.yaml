            threshold: float
            qualified: bool
            resulting_state: CurriculumState
            transition: FrontierTransition | None
  - path: src/pure_rl_shortest_path/experiment.py
    selector:
      quote: |-
        def apply_frontier_validation(
            curriculum: CurriculumConfig,
            state: CurriculumState,
            validation: FrontierValidation,
        ) -> CurriculumValidationDecision:
            """Update the monotone frontier from one independent validation result."""

            state.validate_for(curriculum)
            if validation.frontier != state.frontier:
                raise ValueError("validation frontier does not match current curriculum state")
            qualified = validation.shortest_path_success >= curriculum.advancement_threshold
            streak = state.advancement_streak + 1 if qualified else 0
            transition = None
            frontier = state.frontier
            if (
                streak >= curriculum.advancement_patience
                and frontier < len(curriculum.stages) - 1
            ):
                transition = FrontierTransition(
                    training_step=validation.training_step,
                    completed_frontier=frontier,
                    new_frontier=frontier + 1,
                    validation_shortest_path_success=validation.shortest_path_success,
                )
                frontier += 1
                streak = 0
            resulting_state = CurriculumState(frontier, streak)
            return CurriculumValidationDecision(
                validation=validation,
                threshold=curriculum.advancement_threshold,
                qualified=qualified,
                resulting_state=resulting_state,
                transition=transition,
            )
anchors:
  - id: 019ff4ba-9ea8-7252-88b5-917420afbfd1
    selector:
      quote: |-
        Validation measures the policy on freshly generated problems from the current
        frontier stage. Validation uses its own random stream, applies the declared
        evaluation sampling protocol, and does not update the policy or contribute
        examples to subsequent training rollouts.
    links:
      - id: 019ff06a-a006-77b8-a6df-8cd50fedb55e
        kind: informational
  - id: 019ff4ba-9ea8-751c-84fd-125b5222f94f
    selector:
      quote: |-
        After each scheduled validation, the protocol compares shortest-path success
        with the configured advancement threshold. A qualifying result increments the
        frontier's advancement streak; a nonqualifying result resets the streak to zero.
        Once the streak reaches the configured patience and a succeeding stage exists,
        the frontier advances by exactly one stage and the streak resets.
    links:
