direction: spec-led
id: 019ff5c5-0a59-7a33-a53c-dcad05d31807
rationale: Specify and implement an auditable pressure against unproductive reasoning
  repetition without treating ordinary path reuse as redundant or consulting oracle
  shortest-path edge membership.
