  - abstraction_changed: false
    node: 01a0149f-9d0d-7068-bbe4-09e4cf655e50
    outcome: revised
    rationale: The PPO contract changes and its detailed update/configuration descendants
      must implement and expose the gate
  - abstraction_changed: false
    node: 01a014a1-15c1-75e3-bb0b-d150f5ea5048
    outcome: confirmed_unchanged
    rationale: Value and GAE semantics are unchanged; only code-derived selector ranges are
      refreshed after the PPO configuration shift.
  - abstraction_changed: false
    node: 01a014a1-15c1-7adc-b136-ec4db3ebf1e6
    outcome: revised
    rationale: The detailed PPO update must expose the option and suppress only its clipped
      policy surrogate on all-zero reward batches.
direction: spec-led
id: 01a01613-d9c7-7d19-b074-8938e18ce371
rationale: Propagate configurable suppression of the PPO policy surrogate for all-zero-reward
  rollout batches while preserving independent value and auxiliary optimization.
