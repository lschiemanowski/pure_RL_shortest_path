  - abstraction_changed: false
    node: 019fef85-58fe-7cea-922e-23d922a1f3df
    outcome: confirmed_unchanged
    rationale: GRPO configuration and update semantics are unaffected by this PPO-only option.
  - abstraction_changed: false
    node: 019fef85-58fe-7e1a-9591-20d341a1a7f6
    outcome: confirmed_unchanged
