  - abstraction_changed: false
    node: 019ff06a-a006-77b8-a6df-8cd50fedb55e
    outcome: confirmed_unchanged
    rationale: Independent evaluation is actor-only and does not perform PPO updates.
  - abstraction_changed: false
    node: 019ff06a-a006-7bb5-9289-6b1bbf153896
    outcome: confirmed_unchanged
    rationale: Existing derived-run resumption already permits compatible future training-setting
