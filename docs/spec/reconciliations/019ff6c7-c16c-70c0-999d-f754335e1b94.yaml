id: 019ff6c7-c16c-70c0-999d-f754335e1b94
direction: code-led
rationale: Consolidate duplicated generation, configuration, evidence, and checkpoint
  plumbing without changing any declared experiment, learning, evaluation, or audit
  semantics.
decisions:
  - node: 019ff1ac-85fa-7afb-a05a-c9b771e5ab6a
    outcome: revised
    abstraction_changed: false
    rationale: Group construction, raw full-softmax sampling, ordering, termination,
      and retained sample facts are unchanged; only batching and cached generation are
      shared with evaluation.
  - node: 019ff503-40c8-7f88-851d-5f0e7dc42b95
    outcome: revised
    abstraction_changed: false
    rationale: Evaluation retains its declared greedy or stochastic selector and
      independent seed while reusing the same neutral generation execution loop.
  - node: 019ff54c-87f7-704a-b05e-fb972cc40380
    outcome: revised
    abstraction_changed: false
    rationale: The consuming table reader preserves strict unknown-key rejection,
      required fields, typed construction, defaults, canonical records, and all
      cross-configuration checks.
  - node: 019ff566-c44f-774b-ba4c-8b2dc0509fe6
    outcome: revised
    abstraction_changed: false
    rationale: Training, resumption, evaluation, interruption, and finalization retain
      the same ordering and evidence; repeated checkpoint argument plumbing is shared.
  - node: 019ff566-c44f-7e89-9f82-0d916901384c
    outcome: revised
    abstraction_changed: false
    rationale: Every evidence key and value is retained; reward means are constructed
      from one explicit field list instead of repeated expressions.
  - node: 019ff54c-87f7-7213-ab81-acb27e95126d
    outcome: revised
    abstraction_changed: false
    rationale: Seed range validation and deterministic named derivation are unchanged.
  - node: 019ff180-b61e-7c0a-b65b-28fe5c15b11f
    outcome: revised
    abstraction_changed: false
    rationale: Transformer configuration validation and architecture are unchanged;
      homogeneous field validation is merely expressed once.
  - node: 019ff4ba-9ea8-722a-a072-7649127d0a6b
    outcome: revised
    abstraction_changed: false
    rationale: The asymmetric probability formula, scale constraints, complete stage
      support, sampling order, and graph construction behavior are unchanged.
  - node: 019ff4ba-9ea8-7e1b-926c-6879c5018051
    outcome: revised
    abstraction_changed: false
    rationale: Validation denominators, threshold and patience gating, and monotone
      single-stage advancement are unchanged.
  - node: 019ff618-792a-7305-903e-a73612370445
    outcome: revised
    abstraction_changed: false
    rationale: Sterile classification, both denominators, valid-answer gating, and
      reward composition are unchanged; counters are accumulated in one pass.
