schema_version = 1
name = "deep12-grpo-full-vocabulary-valid-quarter-gen384"
seed = 1
algorithm = "grpo"

[task]
node_label_count = 192
minimum_reason_tokens = 4

[model]
max_context_length = 1024
d_model = 256
layers = 12
heads = 8
mlp_dim = 1024
rope_base = 10000.0
norm_eps = 1e-5

[rollout]
group_size = 16
max_new_tokens = 384
generation_batch_size = 512
temperature = 1.0
top_p = 1.0

[reward]
coverage_coefficient = 0.15
sterile_repetition_coefficient = 0.0
sterile_repetition_mode = "off_answer"

[optimization]
learning_rate = 3e-4
weight_decay = 0.01
beta1 = 0.9
beta2 = 0.95
update_epochs = 2
microbatch_size = 192
clip_epsilon = 0.2
kl_coefficient = 0.001
valid_coefficient = 0.25
gradient_clip = 1.0
advantage_epsilon = 1e-6

[training]
max_steps = 1000000
problems_per_step = 64
reference_update_every = 100

[evaluation]
every_steps = 100
example_count = 256
max_new_tokens = 384
batch_size = 128
mode = "greedy"

[curriculum]
past_decay_scale = 1.0
future_decay_scale = 0.5
advancement_threshold = 0.8
advancement_patience = 3

[[curriculum.stages]]
vertices = 8
edges = 7
min_distance = 1
max_distance = 1

