[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-rl-shortest-path"
version = "0.1.0"
description = "Pure-RL transformer experiments for synthetic shortest paths"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch==2.11.0", "pillow>=10", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[project.scripts]
pure-rl-shortest-path = "pure_rl_shortest_path.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
